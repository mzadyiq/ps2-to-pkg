<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 to PKG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 420px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; }
        .header .icon { font-size: 70px; }
        .header h1 { font-size: 28px; color: #e94560; }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            margin: 15px 0;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
            text-decoration: none;
        }
        .btn-select {
            background: transparent;
            color: #e94560;
            border: 3px dashed #e94560;
        }
        .btn-convert {
            background: #e94560;
            color: white;
        }
        .btn-convert:disabled { background: #555; cursor: not-allowed; }
        .btn-download {
            background: #00b894;
            color: white;
            display: none;
        }
        .status-box {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .status-box .emoji { font-size: 40px; }
        .status-box .text { color: #ccc; font-size: 15px; margin-top: 5px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header">
            <div class="icon">🎮</div>
            <h1>PS2 to PKG</h1>
            <p style="color:#888;">محول ألعاب PS2 إلى PKG</p>
        </div>
        
        <div class="card">
            <button class="btn btn-select" onclick="document.getElementById('fileInput').click()">
                📁 اختر ملف ISO
            </button>
            <input type="file" id="fileInput" accept=".iso,.bin,.ISO,.BIN">
        </div>
        
        <div class="card">
            <button class="btn btn-convert" id="convertBtn" disabled onclick="convertFile()">
                ⚡ ابدأ التحويل
            </button>
            
            <a id="downloadLink" href="#" class="btn btn-download" download="">
                ⬇️ تحميل ملف PKG
            </a>
        </div>
        
        <div class="status-box" id="statusBox">
            <span class="emoji">👋</span>
            <span class="text">اختر ملف ISO للبدء</span>
        </div>
        
    </div>

    <script>
        var selectedFile = null;
        
        document.getElementById('fileInput').onchange = function(e) {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('downloadLink').style.display = 'none';
                document.getElementById('statusBox').innerHTML = 
                    '<span class="emoji">✅</span>' +
                    '<span class="text">تم اختيار: ' + selectedFile.name + '</span>';
            }
        };
        
        function convertFile() {
            if (!selectedFile) return;
            
            var statusBox = document.getElementById('statusBox');
            var convertBtn = document.getElementById('convertBtn');
            var downloadLink = document.getElementById('downloadLink');
            
            statusBox.innerHTML = 
                '<span class="emoji">⏳</span>' +
                '<span class="text">جاري التحويل... يرجى الانتظار</span>';
            convertBtn.disabled = true;
            
            var formData = new FormData();
            formData.append('iso', selectedFile);
            
            fetch('https://mouswie.pythonanywhere.com/convert', {
                method: 'POST',
                body: formData
            })
            .then(function(response) {
                if (!response.ok) throw new Error('خطأ في الخادم');
                return response.blob();
            })
            .then(function(blob) {
                var url = URL.createObjectURL(blob);
                var pkgName = selectedFile.name.replace('.iso','.pkg').replace('.ISO','.pkg');
                
                downloadLink.href = url;
                downloadLink.download = pkgName;
                downloadLink.style.display = 'block';
                
                statusBox.innerHTML = 
                    '<span class="emoji">🎉</span>' +
                    '<span class="text">تم بنجاح! اضغط الزر الأخضر للتحميل</span>';
                convertBtn.disabled = false;
            })
            .catch(function(err) {
                statusBox.innerHTML = 
                    '<span class="emoji">❌</span>' +
                    '<span class="text">' + err.message + '</span>';
                convertBtn.disabled = false;
            });
        }
    </script>
</body>
</html>

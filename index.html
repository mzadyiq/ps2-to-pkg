<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 to PKG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0a0a14;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            margin: 0 auto;
            background: #111122;
            border-radius: 20px;
            padding: 25px;
            border: 1px solid #222244;
        }
        h2 {
            text-align: center;
            color: #ff6b6b;
            font-size: 26px;
            margin-bottom: 5px;
        }
        .sub {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-bottom: 20px;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Segoe UI', Tahoma, sans-serif;
        }
        .btn-select {
            background: #1a1a3e;
            color: #ff6b6b;
            border: 2px dashed #ff6b6b;
        }
        .btn-select:hover { background: #252550; }
        .btn-convert {
            background: #ff6b6b;
            color: #fff;
        }
        .btn-convert:disabled {
            background: #444;
            cursor: not-allowed;
        }
        .btn-download {
            background: #2ed573;
            color: #fff;
            display: none;
            animation: glow 1.5s infinite;
        }
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 10px #2ed573; }
            50% { box-shadow: 0 0 30px #2ed573; }
        }
        
        /* لوحة التحقق */
        .check-panel {
            background: #0d0d1f;
            border-radius: 15px;
            padding: 15px;
            margin: 15px 0;
            border: 1px solid #1a1a3e;
        }
        .check-title {
            color: #ff6b6b;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
            text-align: center;
        }
        .check-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #111133;
            font-size: 13px;
        }
        .check-icon {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            margin-left: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            flex-shrink: 0;
        }
        .icon-wait { background: #333; color: #888; }
        .icon-ok { background: #1a3a1a; color: #2ed573; }
        .icon-err { background: #3a1a1a; color: #ff4757; }
        .icon-prog { background: #3a2a1a; color: #ffa502; animation: spin 1s infinite; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .check-text { flex: 1; }
        .check-info { color: #666; font-size: 11px; }
        
        /* شريط التقدم */
        .progress-wrap {
            margin: 10px 0;
            display: none;
        }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #1a1a3e;
            border-radius: 3px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #ff6b6b;
            width: 0%;
            transition: width 0.5s;
        }
        .progress-text {
            text-align: center;
            font-size: 11px;
            color: #888;
            margin-top: 5px;
        }
        
        input[type="file"] { display: none; }
        .error-box {
            background: #2a0a0a;
            border: 1px solid #ff4757;
            border-radius: 10px;
            padding: 12px;
            margin-top: 10px;
            display: none;
            color: #ff4757;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎮 PS2 to PKG</h2>
        <p class="sub">محول ألعاب PS2 إلى PKG | تشفير AES</p>
        
        <button class="btn btn-select" onclick="document.getElementById('fileInput').click()">
            📁 اختر ملف ISO
        </button>
        <input type="file" id="fileInput" accept=".iso,.bin,.ISO,.BIN">
        
        <button class="btn btn-convert" id="convertBtn" disabled onclick="startConvert()">
            ⚡ ابدأ التحويل
        </button>
        
        <a id="downloadLink" href="#" style="text-decoration:none;">
            <button class="btn btn-download" id="downloadBtn">
                ⬇️ تحميل ملف PKG
            </button>
        </a>
        
        <!-- لوحة الفحص -->
        <div class="check-panel" id="checkPanel">
            <div class="check-title">📋 سجل العمليات</div>
            <div id="checkList"></div>
            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText"></div>
            </div>
            <div class="error-box" id="errorBox"></div>
        </div>
    </div>

    <script>
        var selectedFile = null;
        var checkList = document.getElementById('checkList');
        var errorBox = document.getElementById('errorBox');
        var progressWrap = document.getElementById('progressWrap');
        var progressFill = document.getElementById('progressFill');
        var progressText = document.getElementById('progressText');
        
        function resetChecks() {
            checkList.innerHTML = '';
            errorBox.style.display = 'none';
            progressWrap.style.display = 'none';
            progressFill.style.width = '0%';
            document.getElementById('downloadBtn').style.display = 'none';
        }
        
        function addCheck(text, status, info) {
            var div = document.createElement('div');
            div.className = 'check-item';
            
            var icon = document.createElement('span');
            icon.className = 'check-icon';
            
            if (status === 'wait') {
                icon.className += ' icon-wait';
                icon.innerText = '○';
            } else if (status === 'ok') {
                icon.className += ' icon-ok';
                icon.innerText = '✓';
            } else if (status === 'err') {
                icon.className += ' icon-err';
                icon.innerText = '✗';
            } else if (status === 'prog') {
                icon.className += ' icon-prog';
                icon.innerText = '↻';
            }
            
            var textSpan = document.createElement('span');
            textSpan.className = 'check-text';
            textSpan.innerText = text;
            
            if (info) {
                var infoSpan = document.createElement('span');
                infoSpan.className = 'check-info';
                infoSpan.innerText = info;
                textSpan.appendChild(document.createElement('br'));
                textSpan.appendChild(infoSpan);
            }
            
            div.appendChild(icon);
            div.appendChild(textSpan);
            checkList.appendChild(div);
            
            // التمرير لآخر عنصر
            checkList.parentElement.scrollTop = checkList.parentElement.scrollHeight;
        }
        
        function setProgress(percent, text) {
            progressWrap.style.display = 'block';
            progressFill.style.width = percent + '%';
            progressText.innerText = text || '';
        }
        
        function showError(msg) {
            errorBox.style.display = 'block';
            errorBox.innerText = '❌ ' + msg;
        }
        
        // اختيار الملف
        document.getElementById('fileInput').onchange = function(e) {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                resetChecks();
                addCheck('تم اختيار الملف: ' + selectedFile.name, 'ok', formatSize(selectedFile.size));
                
                if (selectedFile.size > 2147483648) {
                    addCheck('تحذير: حجم الملف كبير جداً (أكثر من 2GB)', 'err');
                    document.getElementById('convertBtn').disabled = true;
                }
            }
        };
        
        function formatSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
            if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + ' MB';
            return (bytes / 1073741824).toFixed(2) + ' GB';
        }
        
        function startConvert() {
            if (!selectedFile) return;
            
            resetChecks();
            document.getElementById('convertBtn').disabled = true;
            
            // المرحلة 1: تجهيز الملف
            addCheck('فحص الملف...', 'prog');
            setProgress(5, 'جاري الفحص...');
            
            setTimeout(function() {
                document.querySelectorAll('.icon-prog').forEach(function(el) {
                    el.className = 'check-icon icon-ok';
                    el.innerText = '✓';
                });
                addCheck('الملف جاهز: ' + formatSize(selectedFile.size), 'ok');
                setProgress(10, 'تم الفحص');
                
                // المرحلة 2: رفع الملف
                addCheck('⏳ جاري رفع الملف إلى الخادم...', 'prog');
                setProgress(15, 'رفع الملف...');
                
                var fd = new FormData();
                fd.append('iso', selectedFile);
                
                var startTime = Date.now();
                
                fetch('https://mouswie.pythonanywhere.com/convert', {
                    method: 'POST',
                    body: fd,
                    signal: AbortSignal.timeout(600000)
                })
                .then(function(response) {
                    var uploadTime = ((Date.now() - startTime) / 1000).toFixed(1);
                    
                    document.querySelectorAll('.icon-prog').forEach(function(el) {
                        el.className = 'check-icon icon-ok';
                        el.innerText = '✓';
                    });
                    
                    addCheck('تم الرفع في ' + uploadTime + ' ثانية', 'ok');
                    setProgress(50, 'الخادم يستلم الملف...');
                    
                    if (!response.ok) {
                        throw new Error('خطأ في الخادم: ' + response.status);
                    }
                    
                    // المرحلة 3: الخادم يعالج
                    addCheck('⏳ جاري التشفير والمعالجة على الخادم...', 'prog');
                    setProgress(60, 'تشفير AES...');
                    
                    return response.blob();
                })
                .then(function(blob) {
                    document.querySelectorAll('.icon-prog').forEach(function(el) {
                        el.className = 'check-icon icon-ok';
                        el.innerText = '✓';
                    });
                    
                    var encryptedSize = blob.size;
                    var ratio = ((encryptedSize / selectedFile.size) * 100).toFixed(0);
                    
                    addCheck('اكتمل التشفير', 'ok');
                    addCheck('حجم PKG: ' + formatSize(encryptedSize), 'ok', 'نسبة: ' + ratio + '%');
                    setProgress(100, 'اكتمل!');
                    
                    // تحميل
                    var pkgName = selectedFile.name.replace('.iso','.pkg').replace('.ISO','.pkg');
                    var url = URL.createObjectURL(blob);
                    var dl = document.getElementById('downloadLink');
                    var db = document.getElementById('downloadBtn');
                    dl.href = url;
                    dl.download = pkgName;
                    db.style.display = 'block';
                    
                    addCheck('✅ جاهز للتحميل!', 'ok');
                    document.getElementById('convertBtn').disabled = false;
                })
                .catch(function(err) {
                    document.querySelectorAll('.icon-prog').forEach(function(el) {
                        el.className = 'check-icon icon-err';
                        el.innerText = '✗';
                    });
                    
                    addCheck('فشل: ' + err.message, 'err');
                    showError(err.message);
                    setProgress(0, 'فشل');
                    document.getElementById('convertBtn').disabled = false;
                });
                
            }, 500);
        }
    </script>
</body>
</html>

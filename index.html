<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 to PKG</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0a0a14;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: #111122;
            border-radius: 20px;
            padding: 25px;
            max-width: 450px;
            margin: 0 auto;
        }
        h2 { color: #ff6b6b; }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .btn-select { background: #1a1a3e; color: #ff6b6b; border: 2px dashed #ff6b6b; }
        .btn-convert { background: #ff6b6b; color: #fff; }
        .btn-convert:disabled { background: #444; }
        .btn-download { background: #2ed573; color: #fff; display: none; animation: glow 1.5s infinite; }
        @keyframes glow {
            0%,100%{box-shadow:0 0 10px #2ed573;}
            50%{box-shadow:0 0 30px #2ed573;}
        }
        .log {
            margin-top: 15px;
            padding: 15px;
            background: #0d0d1f;
            border-radius: 10px;
            font-size: 12px;
            color: #aaa;
            text-align: right;
            max-height: 250px;
            overflow-y: auto;
        }
        .log .ok { color: #2ed573; }
        .log .err { color: #ff4757; }
        .log .info { color: #ffa502; }
        .progress {
            width: 100%;
            height: 6px;
            background: #1a1a3e;
            border-radius: 3px;
            margin: 10px 0;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            background: #ff6b6b;
            width: 0%;
            transition: width 0.3s;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎮 PS2 to PKG</h2>
        <p style="color:#888;font-size:12px;">خادم سحابي | 25MB للقطعة | AES</p>
        
        <button class="btn-select" onclick="document.getElementById('fileInput').click()">
            📁 اختر ملف ISO
        </button>
        <input type="file" id="fileInput" accept=".iso,.bin,.ISO,.BIN">
        
        <button class="btn-convert" id="convertBtn" disabled onclick="startUpload()">
            ⚡ ابدأ التحويل
        </button>
        
        <a id="dl" href="#"><button class="btn-download" id="dbtn">⬇️ تحميل PKG</button></a>
        
        <div class="progress" id="progWrap" style="display:none;">
            <div class="progress-fill" id="progFill"></div>
        </div>
        <div class="log" id="log">👋 اختر ملف ISO للبدء</div>
    </div>

    <script>
        var CHUNK_SIZE = 25 * 1024 * 1024; // 25MB
        var serverUrl = 'https://mouswie.pythonanywhere.com/convert';
        var selectedFile = null;
        var currentChunk = 0;
        var totalChunks = 0;
        var failed = false;
        
        function log(msg, cls) {
            var d = document.getElementById('log');
            d.innerHTML += '<span class="' + (cls||'') + '">' + msg + '</span><br>';
            d.scrollTop = d.scrollHeight;
        }
        
        function setProgress(p) {
            document.getElementById('progWrap').style.display = 'block';
            document.getElementById('progFill').style.width = p + '%';
        }
        
        document.getElementById('fileInput').onchange = function(e) {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('log').innerHTML = '';
                document.getElementById('dbtn').style.display = 'none';
                setProgress(0);
                log('✅ ' + selectedFile.name, 'ok');
                log('📦 ' + (selectedFile.size/1048576).toFixed(1) + ' MB', 'info');
                totalChunks = Math.ceil(selectedFile.size / CHUNK_SIZE);
                log('🧩 ' + totalChunks + ' قطعة (25MB لكل قطعة)', 'info');
            }
        };
        
        function startUpload() {
            if (!selectedFile) return;
            
            currentChunk = 0;
            totalChunks = Math.ceil(selectedFile.size / CHUNK_SIZE);
            failed = false;
            
            document.getElementById('convertBtn').disabled = true;
            document.getElementById('dbtn').style.display = 'none';
            document.getElementById('log').innerHTML = '';
            
            log('🚀 بدء الرفع...', 'info');
            
            uploadNext();
        }
        
        function uploadNext() {
            if (failed || currentChunk >= totalChunks) return;
            
            var start = currentChunk * CHUNK_SIZE;
            var end = Math.min(start + CHUNK_SIZE, selectedFile.size);
            var chunk = selectedFile.slice(start, end);
            var sizeMB = ((end - start) / 1048576).toFixed(1);
            
            var fd = new FormData();
            fd.append('chunk', chunk);
            fd.append('index', currentChunk);
            fd.append('total', totalChunks);
            fd.append('filename', selectedFile.name);
            
            log('📤 قطعة ' + (currentChunk+1) + '/' + totalChunks + ' (' + sizeMB + 'MB)...', 'info');
            
            fetch(serverUrl, { method: 'POST', body: fd })
            .then(function(r) {
                if (!r.ok) throw new Error('خطأ ' + r.status);
                return r.text();
            })
            .then(function(txt) {
                if (txt === 'DONE') {
                    // تم تجميع كل القطع
                    log('✅ تم رفع كل القطع!', 'ok');
                    log('⏳ جاري التشفير والتجهيز...', 'info');
                    setProgress(95);
                    
                    // جلب الملف النهائي
                    fetch(serverUrl + '?final=1&filename=' + encodeURIComponent(selectedFile.name))
                    .then(function(r) { return r.blob(); })
                    .then(function(blob) {
                        var url = URL.createObjectURL(blob);
                        document.getElementById('dl').href = url;
                        document.getElementById('dl').download = selectedFile.name.replace('.iso','.pkg').replace('.ISO','.pkg');
                        document.getElementById('dbtn').style.display = 'block';
                        log('🎉 تم بنجاح! ' + (blob.size/1048576).toFixed(1) + ' MB', 'ok');
                        setProgress(100);
                        document.getElementById('convertBtn').disabled = false;
                    })
                    .catch(function(e) {
                        log('❌ فشل التحميل: ' + e.message, 'err');
                        document.getElementById('convertBtn').disabled = false;
                    });
                } else {
                    // قطعة تم استلامها
                    currentChunk++;
                    var pct = Math.round((currentChunk / totalChunks) * 90);
                    setProgress(pct);
                    log('✅ تم استلام القطعة ' + currentChunk + '/' + totalChunks, 'ok');
                    
                    // إرسال القطعة التالية
                    if (currentChunk < totalChunks) {
                        uploadNext();
                    }
                }
            })
            .catch(function(e) {
                failed = true;
                log('❌ فشل القطعة ' + (currentChunk+1) + ': ' + e.message, 'err');
                log('🔄 جرب مرة أخرى', 'info');
                document.getElementById('convertBtn').disabled = false;
                setProgress(0);
            });
        }
    </script>
</body>
</html>

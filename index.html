<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 to PKG</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0a0a14;
            color: #fff;
            text-align: center;
            padding: 20px;
        }
        .box {
            background: #111122;
            border-radius: 20px;
            padding: 25px;
            max-width: 400px;
            margin: 0 auto;
        }
        h2 { color: #ff6b6b; }
        button {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
        }
        .btn-select { background: #1a1a3e; color: #ff6b6b; border: 2px dashed #ff6b6b; }
        .btn-convert { background: #ff6b6b; color: #fff; }
        .btn-convert:disabled { background: #444; }
        .btn-download { background: #2ed573; color: #fff; display: none; }
        #status {
            margin-top: 15px;
            padding: 15px;
            background: #0d0d1f;
            border-radius: 10px;
            font-size: 13px;
            color: #aaa;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎮 PS2 to PKG</h2>
        <p style="color:#2ed573;font-size:12px;">localhost:3000</p>
        
        <button class="btn-select" onclick="document.getElementById('fileInput').click()">
            📁 اختر ملف ISO
        </button>
        <input type="file" id="fileInput" accept=".iso,.bin">
        
        <button class="btn-convert" id="convertBtn" disabled onclick="convert()">
            ⚡ ابدأ التحويل
        </button>
        
        <a id="dl" href="#"><button class="btn-download" id="dbtn">⬇️ تحميل PKG</button></a>
        
        <div id="status">👋 اختر ملف ISO</div>
    </div>

    <script>
        var f = null;
        document.getElementById('fileInput').onchange = function(e) {
            if (e.target.files[0]) {
                f = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('status').innerText = '✅ ' + f.name + ' (' + (f.size/1048576).toFixed(1) + 'MB)';
            }
        };
        
        function convert() {
            if (!f) return;
            var s = document.getElementById('status');
            var b = document.getElementById('convertBtn');
            s.innerText = '⏳ جاري...';
            b.disabled = true;
            
            var fd = new FormData();
            fd.append('iso', f);
            
            fetch('http://localhost:3000/convert', {method:'POST', body:fd})
            .then(function(r){return r.blob()})
            .then(function(blob){
                var url = URL.createObjectURL(blob);
                document.getElementById('dl').href = url;
                document.getElementById('dl').download = f.name.replace('.iso','.pkg').replace('.ISO','.pkg');
                document.getElementById('dbtn').style.display = 'block';
                s.innerText = '🎉 تم بنجاح! حجم PKG: ' + (blob.size/1048576).toFixed(1) + 'MB';
                b.disabled = false;
            })
            .catch(function(e){
                s.innerText = '❌ تأكد من تشغيل تطبيق PS2 Server';
                b.disabled = false;
            });
        }
    </script>
</body>
</html>

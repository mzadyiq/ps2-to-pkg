<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار PS2 to PKG</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 30px;
        }
        .box {
            background: #16213e;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto;
        }
        h2 { color: #e94560; }
        button {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-pick { background: #0f3460; color: #e94560; border: 2px dashed #e94560; }
        .btn-convert { background: #e94560; color: white; }
        .btn-convert:disabled { opacity: 0.4; }
        #status {
            margin-top: 15px;
            padding: 15px;
            background: #0f0f1a;
            border-radius: 10px;
            font-size: 14px;
            color: #aaa;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎮 اختبار التحويل</h2>
        
        <button class="btn-pick" onclick="document.getElementById('fileInput').click()">
            📁 اختر ملف
        </button>
        <input type="file" id="fileInput">
        
        <button class="btn-convert" id="convertBtn" disabled onclick="uploadFile()">
            ⚡ رفع الملف
        </button>
        
        <div id="status">👋 اختر ملف للبدء</div>
    </div>

    <script>
        var selectedFile = null;
        
        document.getElementById('fileInput').onchange = function(e) {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('status').innerText = '✅ ' + selectedFile.name;
            }
        };
        
        function uploadFile() {
            if (!selectedFile) return;
            
            var statusEl = document.getElementById('status');
            var btn = document.getElementById('convertBtn');
            
            statusEl.innerText = '⏳ جاري الرفع...';
            btn.disabled = true;
            
            var formData = new FormData();
            formData.append('iso', selectedFile);
            
            fetch('https://mouswie.pythonanywhere.com/convert', {
                method: 'POST',
                body: formData
            })
            .then(function(response) {
                statusEl.innerText = '✅ استجابة: ' + response.status;
                return response.blob();
            })
            .then(function(blob) {
                statusEl.innerText = '✅ تم! حجم الملف المستلم: ' + blob.size + ' bytes';
                btn.disabled = false;
            })
            .catch(function(err) {
                statusEl.innerText = '❌ خطأ: ' + err.message;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 to PKG</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f0f1a;
            color: white;
            text-align: center;
            padding: 30px;
        }
        .box {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto;
        }
        h2 { color: #e94560; }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pick {
            background: #16213e;
            color: #e94560;
            border: 2px solid #e94560;
        }
        .btn-convert {
            background: #e94560;
            color: white;
        }
        .btn-download {
            background: #4CAF50;
            color: white;
            display: none;
        }
        .btn-convert:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: #0f0f1a;
            border-radius: 10px;
            color: #aaa;
            min-height: 50px;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎮 PS2 to PKG</h2>
        <p>محول ألعاب PS2 إلى PKG</p>
        
        <button class="btn-pick" onclick="document.getElementById('file').click()">
            📁 اختر ملف ISO
        </button>
        <input type="file" id="file" accept=".iso,.bin">
        
        <br>
        
        <button class="btn-convert" id="convertBtn" disabled onclick="convert()">
            ⚡ تحويل إلى PKG
        </button>
        
        <br>
        
        <a id="downloadLink" style="display:none;">
            <button class="btn-download" id="downloadBtn">⬇️ تحميل ملف PKG</button>
        </a>
        
        <div id="status">👋 جاهز للتحويل</div>
    </div>

    <script>
        var selected = null;
        var pkgUrl = null;
        
        document.getElementById('file').onchange = function(e) {
            if (e.target.files[0]) {
                selected = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('status').innerText = '✅ ' + selected.name;
                document.getElementById('downloadLink').style.display = 'none';
            }
        };
        
        function convert() {
            if (!selected) return;
            
            var s = document.getElementById('status');
            var b = document.getElementById('convertBtn');
            s.innerText = '⏳ جاري التحويل...';
            b.disabled = true;
            
            var fd = new FormData();
            fd.append('iso', selected);
            
            var xhr = new XMLHttpRequest();
            xhr.open('POST', 'https://mouswie.pythonanywhere.com/convert', true);
            xhr.responseType = 'blob';
            
            xhr.onload = function() {
                if (xhr.status === 200) {
                    var blob = xhr.response;
                    pkgUrl = URL.createObjectURL(blob);
                    
                    var dl = document.getElementById('downloadLink');
                    dl.href = pkgUrl;
                    dl.download = selected.name.replace('.iso','.pkg').replace('.ISO','.pkg');
                    dl.style.display = 'inline-block';
                    
                    s.innerText = '✅ تم بنجاح! اضغط تحميل';
                    b.disabled = false;
                } else {
                    s.innerText = '❌ خطأ في الخادم';
                    b.disabled = false;
                }
            };
            
            xhr.onerror = function() {
                s.innerText = '❌ فشل الاتصال بالخادم';
                b.disabled = false;
            };
            
            xhr.send(fd);
        }
    </script>
</body>
</html>

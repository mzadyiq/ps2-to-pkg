<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 to PKG</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 30px;
        }
        .box {
            background: #16213e;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #2a2a4a;
        }
        h2 { color: #e94560; }
        button {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-pick { background: #0f3460; color: #e94560; border: 2px dashed #e94560; }
        .btn-convert { background: #e94560; color: white; }
        .btn-download { background: #00b894; color: white; display: none; }
        .btn-convert:disabled { opacity: 0.4; }
        #status {
            margin-top: 15px;
            padding: 15px;
            background: #0f0f1a;
            border-radius: 10px;
            font-size: 14px;
            color: #aaa;
        }
        input[type="file"] { display: none; }
        iframe { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎮 PS2 to PKG</h2>
        <p style="color:#888;margin-bottom:15px">محول PS2 ISO إلى PKG</p>
        
        <button class="btn-pick" onclick="document.getElementById('fileInput').click()">
            📁 اختر ملف ISO
        </button>
        <input type="file" id="fileInput" accept=".iso,.bin,.ISO,.BIN">
        
        <form id="convertForm" method="POST" 
              action="https://mouswie.pythonanywhere.com/convert" 
              enctype="multipart/form-data" 
              target="downloadFrame">
            <input type="file" id="hiddenFile" name="iso" style="display:none;">
            <button type="submit" class="btn-convert" id="convertBtn" disabled 
                    onclick="startConvert()">
                ⚡ تحويل إلى PKG
            </button>
        </form>
        
        <div id="status">👋 اختر ملف ISO للبدء</div>
    </div>
    
    <iframe name="downloadFrame" id="downloadFrame"></iframe>

    <script>
        var selectedFile = null;
        
        document.getElementById('fileInput').onchange = function(e) {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('status').innerText = '✅ ' + selectedFile.name;
            }
        };
        
        function startConvert() {
            if (!selectedFile) return false;
            
            var dt = new DataTransfer();
            dt.items.add(selectedFile);
            document.getElementById('hiddenFile').files = dt.files;
            
            document.getElementById('status').innerText = '⏳ جاري التحويل... يرجى الانتظار';
            document.getElementById('convertBtn').disabled = true;
            
            return true;
        }
        
        document.getElementById('downloadFrame').onload = function() {
            setTimeout(function() {
                document.getElementById('status').innerText = '🎉 تم بنجاح! تحقق من التحميلات';
                document.getElementById('convertBtn').disabled = false;
            }, 3000);
        };
    </script>
</body>
</html>

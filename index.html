<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 to PKG</title>
    <style>
        body {
            font-family: sans-serif;
            background: #1a1a2e;
            color: white;
            text-align: center;
            padding: 30px;
        }
        .box {
            background: #16213e;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto;
            border: 1px solid #2a2a4a;
        }
        h2 { color: #e94560; }
        button {
            width: 100%;
            padding: 16px;
            margin: 8px 0;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
        .btn-pick { background: #0f3460; color: #e94560; border: 2px dashed #e94560; }
        .btn-convert { background: #e94560; color: white; }
        .btn-download { background: #00b894; color: white; display: none; }
        .btn-convert:disabled { opacity: 0.4; }
        #status {
            margin-top: 15px;
            padding: 15px;
            background: #0f0f1a;
            border-radius: 10px;
            font-size: 14px;
            color: #aaa;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎮 PS2 to PKG</h2>
        <p style="color:#888;margin-bottom:15px">محول PS2 ISO إلى PKG</p>
        
        <button class="btn-pick" onclick="document.getElementById('fileInput').click()">
            📁 اختر ملف ISO
        </button>
        <input type="file" id="fileInput" accept=".iso,.bin,.ISO,.BIN">
        
        <button class="btn-convert" id="convertBtn" disabled onclick="convertFile()">
            ⚡ تحويل إلى PKG
        </button>
        
        <a id="downloadLink" href="#" style="text-decoration:none;">
            <button class="btn-download" id="downloadBtn">
                ⬇️ تحميل ملف PKG
            </button>
        </a>
        
        <div id="status">👋 اختر ملف ISO للبدء</div>
    </div>

    <script>
        var selectedFile = null;
        var pkgUrl = null;
        
        document.getElementById('fileInput').onchange = function(e) {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('downloadBtn').style.display = 'none';
                document.getElementById('status').innerText = '✅ ' + selectedFile.name;
            }
        };
        
        function convertFile() {
            if (!selectedFile) return;
            
            var s = document.getElementById('status');
            var b = document.getElementById('convertBtn');
            s.innerText = '⏳ جاري التحويل...';
            b.disabled = true;
            
            var fd = new FormData();
            fd.append('iso', selectedFile);
            
            fetch('https://mouswie.pythonanywhere.com/convert', {
                method: 'POST',
                body: fd
            })
            .then(function(r) {
                if (!r.ok) throw new Error('خطأ في الخادم');
                return r.blob();
            })
            .then(function(blob) {
                if (pkgUrl) URL.revokeObjectURL(pkgUrl);
                pkgUrl = URL.createObjectURL(blob);
                
                var pkgName = selectedFile.name.replace('.iso','.pkg').replace('.ISO','.pkg');
                var dl = document.getElementById('downloadLink');
                var db = document.getElementById('downloadBtn');
                dl.href = pkgUrl;
                dl.download = pkgName;
                db.style.display = 'block';
                
                s.innerText = '🎉 تم بنجاح! اضغط الزر الأخضر للتحميل';
                b.disabled = false;
            })
            .catch(function(e) {
                s.innerText = '❌ ' + e.message;
                b.disabled = false;
            });
        }
    </script>
</body>
</html>

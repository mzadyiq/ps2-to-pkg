<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 to PKG</title>
    <style>
        body {
            font-family: sans-serif;
            background: #0f0f1a;
            color: white;
            text-align: center;
            padding: 30px;
        }
        .box {
            background: #1a1a2e;
            border-radius: 15px;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto;
        }
        h2 { color: #e94560; }
        button {
            padding: 15px 30px;
            margin: 10px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-pick {
            background: #16213e;
            color: #e94560;
            border: 2px solid #e94560;
        }
        .btn-convert {
            background: #e94560;
            color: white;
        }
        .btn-convert:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 15px;
            background: #0f0f1a;
            border-radius: 10px;
            color: #aaa;
            min-height: 50px;
        }
        input[type="file"] { display: none; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎮 PS2 to PKG</h2>
        <p>محول ألعاب PS2 إلى PKG</p>
        
        <button class="btn-pick" onclick="document.getElementById('file').click()">
            📁 اختر ملف ISO
        </button>
        <input type="file" id="file" accept=".iso,.bin">
        
        <br>
        
        <button class="btn-convert" id="convertBtn" disabled onclick="convert()">
            ⚡ تحويل إلى PKG
        </button>
        
        <div id="status">👋 جاهز للتحويل</div>
    </div>

    <form id="hiddenForm" method="POST" action="https://mouswie.pythonanywhere.com/convert" enctype="multipart/form-data" target="hiddenFrame" style="display:none;">
        <input type="file" id="hiddenFile" name="iso">
    </form>
    <iframe name="hiddenFrame" style="display:none;"></iframe>

    <script>
        var selected = null;
        
        document.getElementById('file').onchange = function(e) {
            if (e.target.files[0]) {
                selected = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('status').innerText = '✅ ' + selected.name;
            }
        };
        
        function convert() {
            if (!selected) return;
            
            var s = document.getElementById('status');
            var b = document.getElementById('convertBtn');
            s.innerText = '⏳ جاري التحويل...';
            b.disabled = true;
            
            // نسخ الملف إلى الفورم المخفي
            var dt = new DataTransfer();
            dt.items.add(selected);
            document.getElementById('hiddenFile').files = dt.files;
            
            // إرسال الفورم
            document.getElementById('hiddenForm').submit();
            
            // انتظار التحميل
            setTimeout(function() {
                s.innerText = '✅ تم بنجاح! (تحقق من التحميلات)';
                b.disabled = false;
            }, 3000);
        }
    </script>
</body>
</html>

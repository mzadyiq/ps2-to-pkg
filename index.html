<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS2 to PKG</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Tahoma', sans-serif;
            background: linear-gradient(135deg, #0f0f1a, #1a1a2e);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 420px; margin: 0 auto; }
        .header { text-align: center; padding: 30px 0; }
        .header .icon { font-size: 70px; }
        .header h1 { font-size: 28px; color: #e94560; }
        .card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 25px;
            margin: 15px 0;
        }
        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            margin: 12px 0;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Tahoma', sans-serif;
            text-align: center;
        }
        .btn-select {
            background: transparent;
            color: #e94560;
            border: 3px dashed #e94560;
        }
        .btn-convert {
            background: #e94560;
            color: white;
        }
        .btn-convert:disabled {
            background: #555;
            cursor: not-allowed;
        }
        .status-box {
            background: rgba(0,0,0,0.3);
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin: 15px 0;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .status-box .emoji { font-size: 40px; }
        .status-box .text { color: #ccc; font-size: 15px; margin-top: 5px; }
        input[type="file"] { display: none; }
        iframe { display: none; }
    </style>
</head>
<body>
    <div class="container">
        
        <div class="header">
            <div class="icon">🎮</div>
            <h1>PS2 to PKG</h1>
            <p style="color:#888;">محول ألعاب PS2 إلى PKG</p>
        </div>
        
        <div class="card">
            <button class="btn btn-select" onclick="document.getElementById('fileInput').click()">
                📁 اختر ملف ISO
            </button>
            <input type="file" id="fileInput" accept=".iso,.bin,.ISO,.BIN">
        </div>
        
        <div class="card">
            <form id="convertForm" method="POST" 
                  action="https://mouswie.pythonanywhere.com/convert" 
                  enctype="multipart/form-data" 
                  target="resultFrame">
                
                <input type="file" id="hiddenFile" name="iso" style="display:none;">
                
                <button type="submit" class="btn btn-convert" id="convertBtn" disabled 
                        onclick="return startConvert()">
                    ⚡ ابدأ التحويل
                </button>
            </form>
        </div>
        
        <div class="status-box" id="statusBox">
            <span class="emoji">👋</span>
            <span class="text">اختر ملف ISO للبدء</span>
        </div>
        
    </div>
    
    <iframe name="resultFrame" id="resultFrame"></iframe>

    <script>
        var selectedFile = null;
        
        document.getElementById('fileInput').onchange = function(e) {
            if (e.target.files[0]) {
                selectedFile = e.target.files[0];
                document.getElementById('convertBtn').disabled = false;
                document.getElementById('statusBox').innerHTML = 
                    '<span class="emoji">✅</span>' +
                    '<span class="text">تم اختيار: ' + selectedFile.name + '</span>';
            }
        };
        
        function startConvert() {
            if (!selectedFile) return false;
            
            // نسخ الملف إلى input المخفي
            var dt = new DataTransfer();
            dt.items.add(selectedFile);
            document.getElementById('hiddenFile').files = dt.files;
            
            document.getElementById('statusBox').innerHTML = 
                '<span class="emoji">⏳</span>' +
                '<span class="text">جاري التحويل... سيبدأ التحميل تلقائياً</span>';
            
            return true;
        }
        
        // استقبال نتيجة التحميل
        document.getElementById('resultFrame').onload = function() {
            setTimeout(function() {
                document.getElementById('statusBox').innerHTML = 
                    '<span class="emoji">🎉</span>' +
                    '<span class="text">تم التحويل بنجاح!<br>تحقق من التحميلات</span>';
                document.getElementById('convertBtn').disabled = false;
            }, 2000);
        };
    </script>
</body>
</html>
